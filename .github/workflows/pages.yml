# Publica o site no GitHub Pages: https://conectados-moriyah.github.io/acampamento-site/
# Roda a cada push na main (ou à mão, em Actions > Deploy GitHub Pages > Run workflow).
# Requer: Settings > Pages > Source = "GitHub Actions".
# O pagamento roda nas Supabase Edge Functions (supabase/functions); nenhum segredo vai para cá.
name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build:pages

      # Rotas renderizadas no navegador (/admin, /inscricao/pagar/:id) não têm arquivo próprio:
      # o Pages serve o 404.html, que é o app, e o roteador do Angular abre a página certa.
      - run: cp dist/acampamento-site/browser/index.csr.html dist/acampamento-site/browser/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/acampamento-site/browser

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
